<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garais Vitolins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+SC:wght@300;400;500&family=IM+Fell+English:ital@1&family=Josefin+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="main-nav">
    <div class="nav-logo">GV</div>
    <div class="nav-lang">
      <button class="lang-btn active" data-lang="lv">LV</button>
      <span class="lang-sep">/</span>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </nav>

  <main class="panels-container">

    <!-- Panel 1: IT biznesa procesa analītiķis -->
    <section class="panel panel--analyst">
      <div class="panel__inner">
        <div class="panel__deco panel__deco--grid"></div>
        <div class="panel__header panel__header--analyst">Biznesa procesu analītiķis</div>
      </div>
    </section>

    <!-- Panel 2: Cēsu stāstu takzinis -->
    <section class="panel panel--storyteller">
      <div class="panel__inner">
        <div class="panel__header panel__header--storyteller">Cēsu stāstu takzinis</div>
      </div>
    </section>

    <!-- Panel 3: Latvian Routes -->
    <section class="panel panel--routes">
      <div class="panel__inner">
        <div class="panel__header panel__header--routes">LatvianRoutes</div>
      </div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
